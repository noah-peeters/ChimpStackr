name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A newer push to the same branch/PR cancels the run still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          pip install "ruff>=0.6"
          ruff check --output-format=github .

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every supported Python on Linux, plus the other shipped platforms
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov

      # Qt's GUI module needs these even offscreen (tests/test_gui.py)
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      # Runners have no GPU: a CPU OpenCL implementation runs the GPU kernels
      - name: CPU OpenCL for the GPU tests
        if: runner.os == 'Linux'
        run: |
          probe='import pyopencl as cl; d = [x for p in cl.get_platforms() for x in p.get_devices()]; cl.Program(cl.Context(d[:1]), "__kernel void k(__global float *a) { a[0] = 1.f; }").build()'
          pip install pocl-binary-distribution
          if ! python -c "$probe"; then
            # its bundled compiler doesn't know every runner CPU: try the distro build
            pip uninstall -y pocl-binary-distribution
            sudo apt-get update -q && sudo apt-get install -y -q pocl-opencl-icd
            python -c "$probe" || echo "::warning::No working CPU OpenCL on this runner; GPU tests are skipped"
          fi
          echo "CHIMPSTACKR_OPENCL_ANY_DEVICE=1" >> "$GITHUB_ENV"

      # Runs everything under tests/ (pyproject testpaths) — new test files
      # are picked up automatically, no need to list them here
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v --cov --cov-report=term
