[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chimpstackr"
dynamic = ["version"]
description = "Open-source focus stacking application"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.9,<3.14"
dependencies = [
    "pyside6-essentials>=6.4.2,<7.0",
    "opencv-python-headless>=4.7,<6.0",
    "numpy>=1.23,<3.0",
    "numba>=0.56",
    "rawpy>=0.18",
    "imageio>=2.29",
    "pyfftw>=0.13",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
    "pre-commit>=3.0",
    "pyinstaller>=6.0",
]
macos = [
    "pyobjc-framework-Cocoa>=9.0",
]

[project.scripts]
chimpstackr-cli = "src.cli:main"

[project.gui-scripts]
chimpstackr = "src.run:main"

[tool.setuptools.dynamic]
version = {attr = "src._version.__pep440_version__"}

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.png", "*.svg", "*.ico", "*.icns"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = ["src/MainWindow/*", "src/run.py"]  # GUI is not covered by the headless test suite

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Ruff defaults (pyflakes + core pycodestyle errors) plus bugbear for likely bugs
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    "E402",  # imports after sys.path / env setup (OPENCV_IO_ENABLE_OPENEXR, cv2.setNumThreads) are intentional
    "E741",  # single-letter math names (l, I) in the registration code
]
